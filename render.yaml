services:
  - type: web
    name: guha-institute-management
    env: python
    runtime: python3
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python scripts/run_migrations.py --apply -y
    startCommand: bash start.sh
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false

