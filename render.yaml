services:
  - type: web
    name: guha-institute-management
    env: python
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: "postgresql://your-neon-user:your-neon-password@ep-xxx.aws.neon.tech/neondb?sslmode=require"
