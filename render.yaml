services:
  - type: web
    name: guha-institute-management
    env: python
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: guha-institute-db
          property: connectionString

databases:
  - name: guha-institute-db
    databaseName: guhadb
    user: guhauser
    plan: free
