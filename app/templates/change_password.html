<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Password - Guha Academy">
<style>body{font-family:system-ui;background:#131521;color:#fff;min-height:100vh;display:grid;place-items:center}.card{width:min(420px,calc(100% - 32px));background:#1e2235;padding:32px;border-radius:20px}label{display:block;margin-top:16px;color:#ddd}input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border-radius:8px;border:1px solid #555;background:#111827;color:#fff}button{width:100%;margin-top:24px;padding:12px;border:0;border-radius:8px;background:#1b6ef3;color:#fff;font-weight:700}.flash{padding:10px;background:#fff;color:#8b0000;border-radius:6px;margin-bottom:12px}a{color:#5aa0ff}</style></head>
<body><main class="card"><h1>Change password</h1>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}
<form method="post"><input type="hidden" name="auth_csrf_token" value="{{ session.get('auth_csrf_token','') }}">
<label for="current_password">Current password</label><input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
<label for="new_password">New password</label><input id="new_password" name="new_password" type="password" minlength="8" autocomplete="new-password" required>
<label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required>
<button type="submit">Change password</button></form><p><a href="{{ url_for('dashboard.dashboard') }}">Back to dashboard</a></p></main></body></html>
