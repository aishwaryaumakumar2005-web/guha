<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password - Guha Academy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-page">
    <main class="auth-card">
        <h1>Change password</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="auth-message" role="alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="post">
            <input type="hidden" name="auth_csrf_token" value="{{ session.get('auth_csrf_token', '') }}">
            <label for="current_password">Current password</label>
            <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
            <label for="new_password">New password</label>
            <input id="new_password" name="new_password" type="password" minlength="8" autocomplete="new-password" required>
            <div class="auth-help">Use at least 8 characters with uppercase, lowercase, and a number.</div>
            <label for="confirm_password">Confirm new password</label>
            <input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required>
            <button type="submit">Change password</button>
        </form>
        <p class="auth-links"><a href="{{ url_for('dashboard.dashboard') }}">Back to dashboard</a></p>
    </main>
</body>
</html>
